schema: mini_jass.pattern_conditional_dose_screen.v1
milestone: M15-C2
expected_execution_host: cpx62
base_loop_config: configs/l1_pattern_reconstruction_loop.yaml

# Fresh after M15-P (271001-271020) and M15-C (272001-272020).
paired_seeds:
  [273001, 273002, 273003, 273004, 273005,
   273006, 273007, 273008, 273009, 273010,
   273011, 273012, 273013, 273014, 273015,
   273016, 273017, 273018, 273019, 273020]

arms:
  - OUTCOME
  - SHUFFLED_CONTEXT_20
  - CONTEXT_20
  - SHUFFLED_CONTEXT_30
  - CONTEXT_30
  - SHUFFLED_CONTEXT_40
  - CONTEXT_40

replay:
  source: G1_WIDE_OUTCOME
  games_per_seed: 1024
  generation: 1
  generator_model: shared_initial_pattern_eval
  seed_offset: 900000
  row_selection: all_generated_train_rows
  immutable_structure_across_arms: true

conditional_mapping:
  family: odd_tanh_linear_wdl_oof_v1
  features: contextual_outcome_supervision_v3_components
  training_label: terminal_selfplay_wdl
  fold_count: 5
  fold_unit: complete_game
  fold_assignment: sha256_rank_round_robin_v1
  fold_namespace: m15c2_conditional_wdl_game_folds_v1
  shuffle_control: within_fold_hash_order_rotate_one_v1
  shuffle_namespace: m15c2_conditional_shuffle_v1
  initialization: zero
  ridge: 0.0001
  max_iterations: 64
  tolerance: 1.0e-10
  line_search_steps: 24
  oracle_training_signal: false
  manual_coefficients_used: false

dose_screen:
  target_formula: (1-alpha)*outcome+alpha*conditional_prediction
  primary_alpha: 0.30
  exploratory_alphas: [0.20, 0.40]
  exploratory_doses_cannot_rescue_primary: true
  selection_basis:
    source_result: M15-C
    observed_alpha_zero_gain: 0.0
    observed_alpha_50_gain: 0.0030931148067807556
    observed_alpha_100_gain: -0.018969765137516404
    rationale: preregistered_interior_dose_near_quadratic_vertex
  every_target_oracle_blind: true

training_schedule:
  total_steps: 1024
  batch_size: 128
  seed_offset: 910000
  explicit_identical_batch_schedule_all_arms: true

# Only the primary dose and its two controls receive the expanded arena.
strength_arena:
  arms: [OUTCOME, SHUFFLED_CONTEXT_30, CONTEXT_30]
  pairs: 512
  seed_base: 961000
  epsilon: 0.0
  confidence_z: 1.96
  confidence_unit: pairs
  start_state_source: development
  role: separate_strength_verdict

power_sizing:
  estimator: normal_paired_difference_monte_carlo_v1
  contrasts_sized:
    - CONTEXT_30_minus_SHUFFLED_CONTEXT_30
    - CONTEXT_30_minus_OUTCOME
  repetitions: 100000
  seed: 44120260813
  paired_seed_count: 20
  conservative_paired_sd: 0.0025
  minimum_effect: 0.002
  paired_confidence_critical_95: 2.093024054408263
  estimated_power_ci_above_zero: 0.92325
  minimum_required_power: 0.80
  gate_has_no_minimum_effect_floor: true

scientific_gate:
  primary_alpha: 0.30
  primary_endpoint: development_zero_regret_gain
  attribution_contrast: CONTEXT_30_minus_SHUFFLED_CONTEXT_30
  operational_contrast: CONTEXT_30_minus_OUTCOME
  paired_confidence_critical_95: 2.093024054408263
  mechanism_pass_requires_attribution_ci_above_zero: true
  operational_pass_requires_outcome_ci_above_zero: true
  minimum_effect_floor: 0.0
  strength_is_separate_from_static_pass: true
  strength_pass_requires_both_arena_ci_above_zero: true
  exploratory_doses_can_rescue_primary: false
  automatic_promotion: false

source_evidence:
  m15c:
    job_id: cpx62-1238-mini-jass-pattern-m15c-v1
    attempt_id: 20260810T194225Z-ea9b0aa3
    implementation_sha: ea9b0aa3ee76d33c2de9f455103e1541fae96257
    protocol_hash: 74dc555948e0191c09814098918c35e2e23935cf6ff44801c6c09165ad97502d
    result_hash: b63008f3e685c5cf20ae18af4e389fa8f7308ae31aa6525e549244f6f80e499d
    frozen_status: FAIL
    frozen_finding: conditional_blend_excludes_practical_operational_gain
    attribution_mean: 0.01601590744757773
    attribution_ci95: [0.014584255908783164, 0.017447558986372298]
    operational_mean: 0.0030931148067807556
    operational_ci95: [0.0024638382310947, 0.003722391382466811]
    old_minimum_operational_gain: 0.003915936905813988
    context_only_minus_outcome_mean: -0.018969765137516404
