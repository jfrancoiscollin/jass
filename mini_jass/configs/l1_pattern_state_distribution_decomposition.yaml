schema: mini_jass.pattern_state_distribution_decomposition.v1
milestone: M18-P
expected_execution_host: cpx62
base_loop_config: configs/l1_pattern_reconstruction_loop.yaml

# Fresh after M17-P (262001-20), M17-P2 (263001-20) and M17-P2R
# (264001-20). One generated eight-generation pack feeds every arm per seed.
paired_seeds:
  [265001, 265002, 265003, 265004, 265005,
   265006, 265007, 265008, 265009, 265010,
   265011, 265012, 265013, 265014, 265015,
   265016, 265017, 265018, 265019, 265020]

arms:
  - G1_ONLY_OUTCOME
  - G8_ONLY_OUTCOME
  - G1_WIDE_OUTCOME
  - MIX_OUTCOME
  - G1_WIDE_EXACT
  - MIX_EXACT
  - MIX_SEQUENTIAL_OUTCOME

# G1_WIDE draws eight times the normal G1 games from the same initial
# generator. Its selected row count is forced to equal MIX exactly.
wide_games: 1024
wide_seed_offset: 780000

# The same explicit sample-draw multiset feeds MIX_OUTCOME, MIX_EXACT and the
# sequential arm. Only batch order and optimizer resets differ in the latter.
training_schedule:
  total_steps: 1024
  sequential_cycles: 8
  batch_size: 128
  seed_offset: 790000

# Exact M17-P2/P2R promotion control used while producing the causal pack.
promotion_control:
  minimum_advancing_generations: 1
  arena_pairs: 128
  arena_epsilon: 0.0
  arena_start_state_source: development
  arena_confidence_unit: pairs
  neutral_arena_score: 0.5
  neutral_score_lower_bound: 0.41337941930464794

