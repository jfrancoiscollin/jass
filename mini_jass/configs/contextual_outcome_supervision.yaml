schema: mini_jass.contextual_outcome_supervision.v3
experiment: contextual_outcome_supervision
status: C1_FROZEN_C2_implementation_ready_for_verification

architecture_contract:
  required_architecture: folded_pattern_value
  value_only: true
  move_selection: search
  policy_head_forbidden: true
  retired_mlp_forbidden: true
  final_inference_path: scalar_value_plus_search
  require_architecture_baseline_frozen: true

# PatternEval n'a pas de representation apprise partagee : ses buckets sont des
# indices fixes. Des tetes lineaires independantes n'enverraient donc aucun
# gradient vers la table scalaire. Le scaffold ci-dessous est le SEUL couplage
# autorise en v3. Tous les bras, y compris WDL_ONLY, paient le meme scaffold.
training_scaffold_v1:
  family: shared_bucket_embedding_exact_scalar_export
  pattern_window: 3
  include_reversible_plies: true
  # Un axe pour la valeur et neuf axes pour les neuf composantes de contexte.
  shared_rank: 10
  aggregation: sum_active_folded_bucket_embeddings
  reversible_feature_embedding: true
  value_head: linear_then_tanh
  auxiliary_heads: linear_training_only
  control_uses_identical_scaffold: true
  initialization:
    algorithm: sha256_counter_normal_v1
    seed_source: paired_seed
    bucket_embedding_standard_deviation: 0.01
    reversible_embedding_standard_deviation: 0.01
    shared_bias: zero
    value_head: first_basis_vector
    value_bias: zero
    auxiliary_head_standard_deviation: 0.31622776601683794
    auxiliary_bias: zero
    initialize_every_head_in_every_arm: true
  export:
    target_architecture: folded_pattern_value
    bucket_weight: dot_value_head_with_each_bucket_embedding
    extra_weight: dot_value_head_with_reversible_embedding
    bias: folded_shared_and_value_bias
    auxiliary_parameters_discarded: true
    maximum_absolute_value_error: 1.0e-6
    required_common_search_action_match_rate: 1.0

