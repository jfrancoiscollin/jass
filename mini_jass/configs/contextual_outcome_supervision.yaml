# M21-P publie le contraste d'arene commun par seed. Le nombre de paires ne
# peut pas etre choisi d'apres sa moyenne : seule sa variance alimente la regle
# gelee ci-dessous. On retient le plus petit barreau conservateur qui atteint
# le MDE/power, ou on arrete le protocole.
power_sizing_v1:
  decision_frozen_before_M21_P_result_read: true
  variance_source:
    milestone: M21-P
    statistic: per_seed_MIX_OUTCOME_minus_G1_WIDE_OUTCOME_common_search_arena_score
    estimator: sample_standard_deviation_ddof_1
    measured_sd_used_as_random_effect_without_noise_deconvolution: true
    minimum_between_seed_standard_deviation: 0.10
  target:
    true_score_delta: 0.10
    minimum_power: 0.80
    provisional_rule: paired_seed_student_t_95_lower_bound_gt_zero
  simulation:
    algorithm: m21p_common_search_random_effects_v1
    replicates: 100000
    seed: 44120260810
    within_game_variance_upper_bound: 0.25
  candidate_pairs_per_seed:
    - 64
    - 128
    - 256
  select: smallest_candidate_meeting_target
  minimum_pairs_per_seed: 64
  on_missing_or_invalid_variance: ABORT_AND_REVISE_PREREGISTRATION
  on_no_candidate_meeting_target: ABORT_AND_REVISE_PREREGISTRATION
  selected_pairs_and_power_report_hash_must_be_frozen_before_C1: true
  selected_pairs_per_seed: 64
