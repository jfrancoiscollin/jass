    - 270516
    - 270517
    - 270518
    - 270519
    - 270520
  registered_contrast: WDL_PLUS_FULL_CONTEXT_minus_WDL_ONLY
  primary_endpoint: common_search_paired_arena_score_minus_half
  confidence_interval: paired_seed_student_t_95
  arena_contract:
    source: configs/l1_pattern_reconstruction_loop.yaml#arena
    pairs_per_seed: power_sizing_v1.selected_pairs_per_seed
    candidate_colours_paired: true
    starts_and_search_identical_within_seed: true
  provisional_readout:
    lower_confidence_bound_strictly_greater_than: 0.0
    positive_label: PROVISIONAL_POSITIVE_REQUIRES_C2
    otherwise_label: PROVISIONAL_NO_SIGNAL_REQUIRES_C2
    terminal_PASS_or_FAIL_forbidden: true
    C2_runs_regardless_of_C1_result: true
  exploratory_arms:
    - WDL_PLUS_CONTEXT
    - WDL_PLUS_DELTA_CONTEXT
    - WDL_PLUS_RESIDUAL
  multiple_comparison_claims_from_exploratory_arms_forbidden: true

c2_disjoint_replication:
  required_even_if_C1_is_flat_or_negative: true
  arms:
    - WDL_ONLY
    - WDL_PLUS_FULL_CONTEXT
  paired_seeds:
    - 270601
    - 270602
    - 270603
    - 270604
    - 270605
    - 270606
    - 270607
    - 270608
    - 270609
    - 270610
    - 270611
    - 270612
    - 270613
    - 270614
    - 270615
    - 270616
    - 270617
    - 270618
    - 270619
    - 270620
  pairs_per_seed: power_sizing_v1.selected_pairs_per_seed
  training_replay_disjoint_from_C1: true
  arena_starts_disjoint_from_C1: true
  same_frozen_recipe_as_C1: true

final_chained_decision:
  evidence_pools:
    - C1
    - C2
  pool_disjointness_required: true
  estimator: sequential_flat_prior_paired_score_v1
  C1_posterior_becomes_C2_prior: true
  heterogeneity_guard:
    statistic: absolute_pool_difference_over_joint_standard_error
    maximum_z: 1.96
  signal_established:
    posterior_probability_score_delta_gt_zero_strictly_greater_than: 0.95
    heterogeneous_pools_forbidden: true
  rejection:
    combined_effect_nonpositive_or_pool_contradiction: true
  otherwise: INCONCLUSIVE
  publish_posterior_probability_above_score_delta:
    - 0.00
    - 0.03
    - 0.05
    - 0.10
    - 0.14
  automatic_promotion_forbidden: true

sealed_test_read:
  after_C1_and_C2_training_and_all_protocol_hashes_are_frozen: true
  arms_read_together:
    - WDL_ONLY
    - WDL_PLUS_FULL_CONTEXT
  all_paired_seeds_read_together: true
  may_select_model: false

mechanism_readout:
  cohort: development
  registered_metric: value_mae
  contrast: WDL_PLUS_FULL_CONTEXT_minus_WDL_ONLY
  improvement_direction: negative
  evidence_pools:
    - C1
    - C2
  estimator: sequential_flat_prior_paired_delta_v1
  signal_rule:
    posterior_probability_delta_lt_zero_strictly_greater_than: 0.95
    same_heterogeneity_guard_as_final_decision: true
  descriptive_metrics:
    - value_sign_accuracy
    - value_spearman
    - mean_selected_regret
    - zero_regret_rate
  interpretation:
    force_and_calibration: inductive_bias_improves_calibration_and_play
    calibration_without_force: mechanism_moves_value_but_not_playing_strength
    force_without_calibration: force_gain_not_explained_by_registered_mechanism
    neither: no_evidence_for_registered_mechanism_or_force
  may_select_model_or_change_weights: false

scaffold_cost_descriptive_control:
  comparison: WDL_ONLY_export_minus_WDL_DIRECT_TABLE
  direct_table_architecture: folded_pattern_value
  same_replay_batches_optimizer_schedule_and_scalar_initial_state: true
  primary_descriptive_metric: common_search_paired_arena_score_minus_half
  secondary_descriptive_metrics:
    - zero_regret_rate
    - value_mae
  excluded_from_C1_C2_and_final_decisions: true
  may_select_model: false

pairing_within_each_pool:
  same_complete_replay_fingerprint: true
  same_wdl_targets_non_oracle: true
  same_exportable_value_initial_state_hash: true
  same_scaffold_initialization_schedule: true
  same_batch_indices_and_order: true
  same_optimizer_hyperparameters_and_step_count: true
  same_common_arena_search: true
  same_arena_starts_colours_and_seeds: true
  same_gradient_updates: false

oracle_boundary:
  policy: explicitly_scoped
  allowed:
    C0_train_cohort_protocol_validation: observer
    C1_ORACLE_VALUE_DIAGNOSTIC: diagnostic_training_signal
    C3_train_only_context_baseline: diagnostic_training_signal
  forbidden_for_every_deployable_arm:
    - selfplay_generation
    - target_construction
    - sample_selection
    - loss_weighting
    - promotion
  diagnostic_outputs_isolated_from_deployable_checkpoints: true

stages:
  C0: validate_context_and_baseline_or_abort
  C1: fixed_weight_pool_A_with_provisional_readout_only
  C2: mandatory_disjoint_pool_B_and_final_chained_decision
  C3: compare_deterministic_vs_train_only_calibrated_context_baseline

reporting:
  compact_gitops_summary: true
  phase_timings_in_summary: true
  report_realized_compute: true
  stratify_by_context_disadvantage: true
  hash_context_definitions: true
  hash_baseline_coefficients_and_tau: true
  hash_training_scaffold_and_export: true
  hash_power_sizing_input_result_and_selected_pairs: true
  hash_M21P_replay_source_decision: true
  report_C1_and_C2_separately_before_chaining: true
  report_mechanism_categories: true

boundaries:
  promotable: false
  production_jass_changes_authorized: false
  direct_10x10_transfer_authorized: false
  fresh_seed_replication_required_before_any_transfer: true
