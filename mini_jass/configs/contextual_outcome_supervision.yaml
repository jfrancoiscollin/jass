replay_source_decision_v1:
  decision_frozen_before_M21_P_result_read: true
  on_M21_P_PASS: MIX_OUTCOME
  on_M21_P_FAIL: G1_WIDE_OUTCOME
  on_M21_P_INCONCLUSIVE: ABORT_AND_RESOLVE_M21P
  on_invalid_or_failed_M21_P: ABORT_AND_RESOLVE_M21P
  selected_source: G1_WIDE_OUTCOME
  same_selected_pack_for_every_non_oracle_arm: true
  selected_source_and_M21P_hash_frozen_across_C1_C2: true

# M21-P publie le contraste d'arene commun par seed. Le nombre de paires ne
# peut pas etre choisi d'apres sa moyenne : seule sa variance alimente la regle
# gelee ci-dessous. On retient le plus petit barreau conservateur qui atteint
# le MDE/power, ou on arrete le protocole.
power_sizing_v1:
  decision_frozen_before_M21_P_result_read: true
  variance_source:
    milestone: M21-P
    statistic: per_seed_MIX_OUTCOME_minus_G1_WIDE_OUTCOME_common_search_arena_score
    estimator: sample_standard_deviation_ddof_1
    measured_sd_used_as_random_effect_without_noise_deconvolution: true
    minimum_between_seed_standard_deviation: 0.10
  target:
    true_score_delta: 0.10
    minimum_power: 0.80
    provisional_rule: paired_seed_student_t_95_lower_bound_gt_zero
  simulation:
    algorithm: m21p_common_search_random_effects_v1
    replicates: 100000
    seed: 44120260810
    within_game_variance_upper_bound: 0.25
  candidate_pairs_per_seed:
    - 64
    - 128
    - 256
  select: smallest_candidate_meeting_target
  minimum_pairs_per_seed: 64
  on_missing_or_invalid_variance: ABORT_AND_REVISE_PREREGISTRATION
  on_no_candidate_meeting_target: ABORT_AND_REVISE_PREREGISTRATION
  selected_pairs_and_power_report_hash_must_be_frozen_before_C1: true
  selected_pairs_per_seed: 64
  frozen_report_v1:
    readout_job_id: cpx62-1224-mini-jass-m21p-freeze-readout-v1
    readout_attempt_id: 20260810T071233Z-fe188c93
    result_uri: r2:jass-data/runs/cpx62-1224-mini-jass-m21p-freeze-readout-v1/20260810T071233Z-fe188c93
    report_hash: db870aec453cf8876191b1624edd13045be50cf589aca33184d6175f67bae86c
    source_result_hash: 2a376c7215212777e466fe41c7bf30a1af1d700f706ee7ca882c0fe2b3ac2745
    source_verdict: FAIL
    selected_replay_source: G1_WIDE_OUTCOME
    measured_primary_delta_sd: 0.004319942195275082
    used_random_effect_sd: 0.10
    candidates:
      - pairs_per_seed: 64
        estimated_power: 0.88898
      - pairs_per_seed: 128
        estimated_power: 0.94967
      - pairs_per_seed: 256
        estimated_power: 0.97226
    selected_pairs_per_seed: 64
    c0_or_training_authorized: false

program_order:
  phase: later_factor_after_pattern_reconstruction_diagnosis
  requires_M21_P_result_and_reconstruction_decision_record: true
  automatic_queue_from_PR_merge: false
  may_displace_baseline_reconstruction_cells: false
  C0_or_C1_launch_while_M21P_running_forbidden: true
  M21P_completed_before_C0: true

context_v1:
  pov: side_to_move
  range: approximately_minus1_plus1
  symmetry: rot180_plus_colour_swap
  loss_reduction: mean_over_components
  feature_definition_hash: c036cdc3677d094fd9bfaf46e0042ee6c43b60ba2816219deecfb52d1b395e03
  frozen_geometry:
    square_coordinates: [[0, 0], [0, 2], [0, 4], [1, 1], [1, 3], [2, 0], [2, 2], [2, 4], [3, 1], [3, 3], [4, 0], [4, 2], [4, 4]]
    center_squares: [3, 4, 6, 8, 9]
    legal_move_normalizer: 8
    capture_option_normalizer: 4
  components:
    - material_man_delta
    - material_king_delta
    - legal_move_delta
    - capture_option_delta
    - promotion_pressure_delta
    - blocked_man_delta
    - advanced_man_delta
    - center_presence_delta
    - terminal_flag

baseline_v1:
  family: deterministic_linear_tanh
  frozen_before_C0: true
  definition_hash: 276d1ad969886d0bdb4f81218a488b1905af63f2fca3e68ffc0fc725758a6820
  weights:
    material_man_delta: 1.00
    material_king_delta: 1.50
    legal_move_delta: 0.20
    capture_option_delta: 0.15
    promotion_pressure_delta: 0.20
    blocked_man_delta: -0.15
    advanced_man_delta: 0.10
    center_presence_delta: 0.05
    terminal_flag: 0.00
  tau: 1.50
  residual_clip: 1.50
  fitted_from_development_or_frozen_test_forbidden: true
  terminal_flag_contract:
    weight_deliberately_zero: true
    reason: prevent_terminal_outcome_leakage_into_context_baseline
    residual_training_states_must_be_nonterminal_pre_move: true
    exactness_gate_applies_to_context_feature_not_baseline_prediction: true

# C0 est une porte de validite de protocole, pas une selection d'arm. Si elle
# echoue, C1 entier s'arrete : aucun coefficient ni bras n'est ajuste a chaud.
c0_gate:
  oracle_characterization_cohort: train
  decision_frozen_before_oracle_read: true
  pairwise_ordering:
    eligible_pairs: unequal_exact_value
    estimator: exact_all_eligible_pairs_rank_count_v1
    maximum_pairs: null
    baseline_tie_credit: 0.5
  required:
    deterministic_repeatability_exact: true
    pov_symmetry_maximum_absolute_error: 0.0
    context_terminal_flag_exactness_rate: 1.0
    minimum_baseline_spearman_vs_exact_value: 0.30
    minimum_baseline_pairwise_ordering_rate: 0.55
  on_failure: ABORT_C1_AND_REVISE_PREREGISTRATION
  posthoc_coefficient_change_forbidden: true
  posthoc_arm_removal_forbidden: true

# Pas de screen : les poids sont figes. Dans le bras FULL, leur somme reste
# 0.25 afin de ne pas tripler la dose auxiliaire par rapport aux bras simples.
c1_arms:
  WDL_ONLY:
    value_target: terminal_wdl
    beta_context: 0.0
    gamma_delta_context: 0.0
    eta_residual: 0.0
    oracle_training_signal: false
  WDL_PLUS_CONTEXT:
    value_target: terminal_wdl
    beta_context: 0.25
    gamma_delta_context: 0.0
    eta_residual: 0.0
    oracle_training_signal: false
  WDL_PLUS_DELTA_CONTEXT:
    value_target: terminal_wdl
    beta_context: 0.0
    gamma_delta_context: 0.25
    eta_residual: 0.0
    oracle_training_signal: false
  WDL_PLUS_RESIDUAL:
    value_target: terminal_wdl
    beta_context: 0.0
    gamma_delta_context: 0.0
    eta_residual: 0.25
    oracle_training_signal: false
  WDL_PLUS_FULL_CONTEXT:
    value_target: terminal_wdl
    beta_context: 0.08333333333333333
    gamma_delta_context: 0.08333333333333333
    eta_residual: 0.08333333333333333
    oracle_training_signal: false
  ORACLE_VALUE_DIAGNOSTIC:
    value_target: exact_oracle
    beta_context: 0.0
    gamma_delta_context: 0.0
    eta_residual: 0.0
    oracle_training_signal: true
    promotable: false
    excluded_from_primary_hypothesis: true

c1_decision:
  paired_seeds:
    - 270501
    - 270502
    - 270503
    - 270504
    - 270505
    - 270506
    - 270507
    - 270508
    - 270509
    - 270510
    - 270511
    - 270512
    - 270513
    - 270514
