schema: mini_jass.pattern_generation_ladder.v2
milestone: M17-P2
expected_execution_host: cpx62
base_loop_config: configs/l1_pattern_reconstruction_loop.yaml

ladder_max: 8
report_rungs: [1, 2, 4, 8]
paired_seeds:
  [263001, 263002, 263003, 263004, 263005,
   263006, 263007, 263008, 263009, 263010,
   263011, 263012, 263013, 263014, 263015,
   263016, 263017, 263018, 263019, 263020]

# M17-P v1 used 4 pairs. At a neutral arena score of 0.5, its lower bound was
# only 0.1535 against the 0.40 promotion threshold. One hundred twenty-eight
# independent pairs give a neutral lower bound of 0.41337941930464794. The tool
# treats each two-game pair, not each game, as one effective observation and
# recomputes this value from the live arena formula.
# The v1 arena was deterministic from one fixed start, so additional pairs
# would otherwise be exact duplicates. M17-P2 samples one distinct non-terminal
# development state per pair, without replacement. Action selection stays
# greedy and candidate/parent swap roles from the exact same start state.
promotion_control:
  report_per_generation: true
  minimum_advancing_generations: 1
  arena_pairs: 128
  arena_epsilon: 0.0
  arena_start_state_source: development
  arena_confidence_unit: pairs
  neutral_arena_score: 0.5
  neutral_score_lower_bound: 0.41337941930464794

source_iteration:
  schema: mini_jass.pattern_generation_ladder.v1
  milestone: M17-P
  protocol_hash: c4dd421fa0828412ce9d470d39bc055b7bb102c10c5374325063eb711db00fa8
  result_hash: aaf5f07ccca431ef0a3511e948e55ada6842588f07bd7a11db6c73f0ee472191
  diagnosis: arena_gate_replayed_two_fixed_start_games

scientific_gate:
  minimum_monotone_rungs: 3
  minimum_final_zero_regret_delta: 0.0

boundaries:
  cohorts_read: [development]
  cohorts_sealed: [frozen_test]
  promotable: false
  production_jass_changes_authorized: false
  direct_10x10_transfer_authorized: false
