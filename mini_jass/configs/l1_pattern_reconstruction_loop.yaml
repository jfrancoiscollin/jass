schema: mini_jass.selfplay.v1
mode: search_improved
seed: 260000
deterministic: true
generations: 1
split_seed: 20260806
frozen_split_manifest: artefacts/split_manifest.v1.json
expected_split_manifest_hash: 9e4021da3331bc6ed4976f0ef9baa3c8721a4458c092420749588fbe84e35524

# Reconstruction v1: architecture correcte, recette de laboratoire gelee.
# Le changement scientifique vise PatternEval + actions par recherche. MSE,
# AdamW, dose et exploration restent ceux du protocole Mini-Jass M8 afin de ne
# pas confondre architecture et recette de fit production (logistic/L-BFGS).
model:
  architecture: folded_pattern_value
  pattern_window: 3
  include_reversible_plies: true

self_play:
  mode: search_improved
  games: 128
  max_plies: 64
  search_enabled: true
  search_depth: 32
  budget_policy: fixed
  node_budgets: [16]
  start_state_source: train_split
  root_allocation: balanced
  behavior_policy: search_scores
  policy_target: score_softmax
  policy_target_temperature: 0.25
  exploration:
    strategy: top_k_uniform
    epsilon: 0.0
    top_k: 2
    temperature: 1.0

replay:
  capacity: 8192
  strategy: disabled
  training_samples: 1024

training:
  steps: 1024
  batch_size: 128
  learning_rate: 0.002
  weight_decay: 0.0001
  value_weight: 1.0
  policy_weight: 0.0

arena:
  pairs: 4
  max_plies: 64
  search_depth: 2
  node_budget: 4
  epsilon: 0.0
  confidence_z: 1.96

development:
  batch_size: 8192

promotion:
  minimum_development_improvement: 0.0
  minimum_arena_lower_bound: 0.40

runtime:
  threads: 1
