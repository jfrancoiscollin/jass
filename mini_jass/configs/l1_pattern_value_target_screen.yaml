schema: mini_jass.pattern_value_target_screen.v1
milestone: M15-P
expected_execution_host: cpx62
base_loop_config: configs/l1_pattern_reconstruction_loop.yaml

# Fresh after the PatternEval reconstruction pools (261001-266020) and the
# contextual C1/C2 pools (270501-270620).
paired_seeds:
  [271001, 271002, 271003, 271004, 271005,
   271006, 271007, 271008, 271009, 271010,
   271011, 271012, 271013, 271014, 271015,
   271016, 271017, 271018, 271019, 271020]

arms:
  - OUTCOME
  - SEARCH_ROOT
  - BLEND_50
  - EXACT_ORACLE

# M21-P failed its generation-composition strength gate. Its frozen rule
# therefore selects the equal-volume generation-1 source for later factors.
replay:
  source: G1_WIDE_OUTCOME
  games_per_seed: 1024
  generation: 1
  generator_model: shared_initial_pattern_eval
  seed_offset: 860000
  row_selection: all_generated_train_rows
  immutable_structure_across_arms: true

targets:
  OUTCOME:
    source: terminal_selfplay_wdl
    oracle_training_signal: false
  SEARCH_ROOT:
    source: bounded_negamax_root_score
    clip: [-1.0, 1.0]
    oracle_training_signal: false
  BLEND_50:
    source: outcome_search_blend
    search_weight: 0.50
    oracle_training_signal: false
  EXACT_ORACLE:
    source: exact_train_value
    oracle_training_signal: true
    diagnostic_only: true
    promotable: false

training_schedule:
  total_steps: 1024
  batch_size: 128
  seed_offset: 870000
  explicit_identical_batch_schedule_all_arms: true

# Direct candidate-versus-OUTCOME arenas are descriptive in M15-P. A passing
# static response must be replicated for strength on fresh seeds before any
# mechanism can move further down the roadmap.
descriptive_strength_arena:
  pairs: 128
  seed_base: 941000
  epsilon: 0.0
  confidence_z: 1.96
  confidence_unit: pairs
  start_state_source: development

power_sizing:
  estimator: normal_paired_difference_monte_carlo_v1
  repetitions: 100000
  seed: 44120260811
  paired_seed_count: 20
  conservative_paired_sd: 0.005
  minimum_effect: 0.003915936905813988
  paired_confidence_critical_95: 2.093024054408263
  estimated_power_ci_above_zero: 0.91212
  minimum_required_power: 0.80

scientific_gate:
  primary_contrast: BLEND_50_minus_OUTCOME
  primary_endpoint: development_zero_regret_gain
  paired_confidence_critical_95: 2.093024054408263
  require_primary_ci_above_zero: true
  minimum_oracle_gain_recovery_fraction: 0.50
  minimum_absolute_response_gain: 0.003915936905813988
  oracle_gap_must_replicate_with_ci_above_zero: true
  SEARCH_ROOT_is_mechanistic_only: true
  exploratory_arm_cannot_rescue_primary: true

source_evidence:
