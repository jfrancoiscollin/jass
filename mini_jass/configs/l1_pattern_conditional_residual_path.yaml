scientific_gate:
  primary_question: separate_residual_path_preserves_conditional_and_temporal_signals
  primary_endpoint: development_zero_regret_gain_and_paired_strength
  paired_confidence_critical_95: 2.0686576104190406
  require_RESIDUAL_30_minus_ADDITIVE_30_static_ci_above_zero: true
  require_RESIDUAL_30_minus_ADDITIVE_30_strength_ci_above_zero: true
  require_RESIDUAL_30_minus_SHUFFLED_RESIDUAL_30_static_ci_above_zero: true
  require_RESIDUAL_30_minus_SHUFFLED_RESIDUAL_30_strength_ci_above_zero: true
  minimum_effect_floor: 0.0
  direct_additive_and_singletons_cannot_rescue_primary: true
  selection_requires_RESIDUAL_30_minus_CONTEXT_30_static_ci_above_zero: true
  selection_requires_RESIDUAL_30_minus_CONTEXT_30_strength_ci_above_zero: true
  selection_requires_RESIDUAL_30_minus_LAMBDA_50_static_ci_above_zero: true
  selection_requires_RESIDUAL_30_minus_LAMBDA_50_strength_ci_above_zero: true
  selection_requires_RESIDUAL_30_minus_OUTCOME_static_ci_above_zero: true
  selection_requires_RESIDUAL_30_minus_OUTCOME_strength_ci_above_zero: true
  otherwise_retain_incumbent_CONTEXT_30: true
  automatic_promotion: false

