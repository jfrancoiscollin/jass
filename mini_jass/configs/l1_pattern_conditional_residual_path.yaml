schema: mini_jass.pattern_conditional_residual_path.v1
milestone: M15-C4
expected_execution_host: cpx62
base_loop_config: configs/l1_pattern_reconstruction_loop.yaml

paired_seeds:
  [277001, 277002, 277003, 277004, 277005, 277006,
   277007, 277008, 277009, 277010, 277011, 277012,
   277013, 277014, 277015, 277016, 277017, 277018,
   277019, 277020, 277021, 277022, 277023, 277024]

arms:
  - OUTCOME
  - LAMBDA_50
  - CONTEXT_30
  - SHUFFLED_ADDITIVE_30
  - ADDITIVE_30
  - SHUFFLED_RESIDUAL_30
  - RESIDUAL_30

replay:
  source: G1_WIDE_OUTCOME
  games_per_seed: 1024
  generation: 1
  generator_model: shared_initial_pattern_eval
  seed_offset: 1060000
  row_selection: all_generated_train_rows
  temporal_returns_built_before_train_row_filter: true
  immutable_structure_across_arms: true

conditional_mapping:
  family: odd_tanh_linear_wdl_oof_v1
  features: contextual_outcome_supervision_v3_components
  training_label: terminal_selfplay_wdl
  fold_count: 5
  fold_unit: complete_game
  fold_assignment: sha256_rank_round_robin_v1
  fold_namespace: m15c4_conditional_wdl_game_folds_v1
  shuffle_control: within_fold_hash_order_rotate_one_v1
  shuffle_namespace: m15c4_conditional_shuffle_v1
  initialization: zero
  ridge: 0.0001
  max_iterations: 64
  tolerance: 1.0e-10
  line_search_steps: 24
  oracle_training_signal: false
  manual_coefficients_used: false

temporal_target:
  source: temporal_lambda_return
  lambda: 0.50
  successor_bootstrap: negated_successor_root_score
  recurrence: "-((1-lambda)*successor_search+lambda*successor_return)"
  terminal_or_last_sample_fallback: terminal_selfplay_wdl
  search_score_clip: [-1.0, 1.0]
  complete_trajectory_grouping: true
  contiguous_ply_required: true
  full_generated_trace_used_before_train_filter: true
  oracle_training_signal: false

conditional_residual_path:
  alpha: 0.30
  context_formula: 0.70*outcome+0.30*conditional_prediction
  additive_formula: clip(lambda_50+0.30*(conditional_prediction-outcome),-1,1)
  shuffled_control_uses_same_formula: true
  direct_and_residual_targets_identical: true
  base_target: LAMBDA_50
  base_frozen_during_residual_stage: true
  residual_initialization: zero
  combined_training_value: tanh(base_raw_score+residual_raw_score)
  collapse_rule: add_linear_weights_and_bias_before_inference
  collapsed_inference_architecture: folded_pattern_value
  extra_inference_parameters: 0
  every_target_bounded: true
  every_target_oracle_blind: true

training_schedule:
  total_steps_per_arm: 2048
  direct_steps: 2048
  residual_base_steps: 1024
  residual_correction_steps: 1024
  batch_size: 128
  seed_offset: 1070000
  explicit_shared_schedule: true
  residual_stages_partition_shared_schedule: true
  residual_base_shared_between_aligned_and_shuffled: true
  equal_effective_optimizer_steps_per_arm: true

strength_arena:
  arms:
    [OUTCOME, LAMBDA_50, CONTEXT_30, SHUFFLED_ADDITIVE_30,
     ADDITIVE_30, SHUFFLED_RESIDUAL_30, RESIDUAL_30]
  pairs: 512
  seed_base: 1080000
  epsilon: 0.0
  confidence_z: 1.96
  confidence_unit: pairs
  start_state_source: development
  role: confirmatory_conditional_residual_path

