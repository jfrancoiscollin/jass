  conditional_attribution_strength:
    contrasts_sized: [RESIDUAL_30_minus_SHUFFLED_RESIDUAL_30]
    endpoint: paired_arena_score
    estimator: normal_paired_difference_monte_carlo_v1
    repetitions: 100000
    seed: 44120260825
    paired_seed_count: 24
    conservative_paired_sd: 0.003
    minimum_effect_for_power_only: 0.0019
    minimum_effect: 0.0019
    paired_confidence_critical_95: 2.0686576104190406
    estimated_power_ci_above_zero: 0.84403
    minimum_required_power: 0.80
