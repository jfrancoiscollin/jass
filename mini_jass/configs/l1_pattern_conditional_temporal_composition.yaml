schema: mini_jass.pattern_conditional_temporal_composition.v1
milestone: M15-C3
expected_execution_host: cpx62
base_loop_config: configs/l1_pattern_reconstruction_loop.yaml

# Fresh after M15-C2R (275001-275020); four extra seeds restore >=80% power
# for the smallest preregistered composition axis without adding an effect floor.
paired_seeds:
  [276001, 276002, 276003, 276004, 276005, 276006,
   276007, 276008, 276009, 276010, 276011, 276012,
   276013, 276014, 276015, 276016, 276017, 276018,
   276019, 276020, 276021, 276022, 276023, 276024]

arms:
  - OUTCOME
  - LAMBDA_50
  - SHUFFLED_CONTEXT_30
  - CONTEXT_30
  - SHUFFLED_COMPOSED_30
  - COMPOSED_30

replay:
  source: G1_WIDE_OUTCOME
  games_per_seed: 1024
  generation: 1
  generator_model: shared_initial_pattern_eval
  seed_offset: 1030000
  row_selection: all_generated_train_rows
  temporal_returns_built_before_train_row_filter: true
  immutable_structure_across_arms: true

conditional_mapping:
  family: odd_tanh_linear_wdl_oof_v1
  features: contextual_outcome_supervision_v3_components
  training_label: terminal_selfplay_wdl
  fold_count: 5
  fold_unit: complete_game
  fold_assignment: sha256_rank_round_robin_v1
  fold_namespace: m15c3_conditional_wdl_game_folds_v1
  shuffle_control: within_fold_hash_order_rotate_one_v1
  shuffle_namespace: m15c3_conditional_shuffle_v1
  initialization: zero
  ridge: 0.0001
  max_iterations: 64
  tolerance: 1.0e-10
  line_search_steps: 24
  oracle_training_signal: false
  manual_coefficients_used: false

temporal_target:
  source: temporal_lambda_return
  lambda: 0.50
  successor_bootstrap: negated_successor_root_score
  recurrence: "-((1-lambda)*successor_search+lambda*successor_return)"
  terminal_or_last_sample_fallback: terminal_selfplay_wdl
  search_score_clip: [-1.0, 1.0]
  complete_trajectory_grouping: true
  contiguous_ply_required: true
  full_generated_trace_used_before_train_filter: true
  oracle_training_signal: false

composition:
  alpha: 0.30
  outcome_context_formula: 0.70*outcome+0.30*conditional_prediction
  temporal_context_formula: 0.70*lambda_50+0.30*conditional_prediction
  shuffled_controls_use_same_formula: true
  every_target_convex_and_bounded: true
  every_target_oracle_blind: true

training_schedule:
  total_steps: 1024
  batch_size: 128
  seed_offset: 1040000
  explicit_identical_batch_schedule_all_arms: true

strength_arena:
  arms:
    [OUTCOME, LAMBDA_50, SHUFFLED_CONTEXT_30, CONTEXT_30,
     SHUFFLED_COMPOSED_30, COMPOSED_30]
  pairs: 512
  seed_base: 1050000
  epsilon: 0.0
  confidence_z: 1.96
  confidence_unit: pairs
  start_state_source: development
  role: confirmatory_composition_strength

power_sizing:
  temporal_increment_static:
    contrasts_sized: [COMPOSED_30_minus_CONTEXT_30]
    endpoint: development_zero_regret_gain
    estimator: normal_paired_difference_monte_carlo_v1
    repetitions: 100000
    seed: 44120260818
