    estimator: normal_paired_difference_monte_carlo_v1
    repetitions: 100000
    seed: 44120260820
    paired_seed_count: 24
    conservative_paired_sd: 0.0025
    minimum_effect_for_power_only: 0.002
    minimum_effect: 0.002
    paired_confidence_critical_95: 2.0686576104190406
    estimated_power_ci_above_zero: 0.96424
    minimum_required_power: 0.80
    gate_has_no_minimum_effect_floor: true
  conditional_attribution_strength:
    contrasts_sized: [COMPOSED_30_minus_SHUFFLED_COMPOSED_30]
    endpoint: paired_arena_score
    estimator: normal_paired_difference_monte_carlo_v1
    repetitions: 100000
    seed: 44120260821
    paired_seed_count: 24
    conservative_paired_sd: 0.0025
    minimum_effect_for_power_only: 0.0015
    minimum_effect: 0.0015
    paired_confidence_critical_95: 2.0686576104190406
    estimated_power_ci_above_zero: 0.80359
    minimum_required_power: 0.80
    gate_has_no_minimum_effect_floor: true

scientific_gate:
  primary_question: temporal_increment_and_conditional_attribution_survive_composition
  primary_endpoint: development_zero_regret_gain_and_paired_strength
  paired_confidence_critical_95: 2.0686576104190406
  require_COMPOSED_30_minus_CONTEXT_30_static_ci_above_zero: true
  require_COMPOSED_30_minus_CONTEXT_30_strength_ci_above_zero: true
  require_COMPOSED_30_minus_SHUFFLED_COMPOSED_30_static_ci_above_zero: true
  require_COMPOSED_30_minus_SHUFFLED_COMPOSED_30_strength_ci_above_zero: true
  minimum_effect_floor: 0.0
  singleton_confirmation_cannot_rescue_primary: true
  selection_requires_COMPOSED_30_minus_LAMBDA_50_static_ci_above_zero: true
  selection_requires_COMPOSED_30_minus_LAMBDA_50_strength_ci_above_zero: true
  selection_requires_COMPOSED_30_minus_OUTCOME_static_ci_above_zero: true
  selection_requires_COMPOSED_30_minus_OUTCOME_strength_ci_above_zero: true
  otherwise_retain_incumbent_CONTEXT_30: true
  automatic_promotion: false

