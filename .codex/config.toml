# Jass — project-level Codex defaults.
# Sol is the reliable orchestrator. AGENTS.md routes bounded tactical work
# to the Spark role automatically and keeps scientific reasoning on Sol.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 2

[agents.fast]
description = "Fast bounded Jass execution worker. Use for localized technical inspection, minimal implementation, diagnostics, and validation when the scientific contract is already fixed."
config_file = "agents/fast.toml"

[agents.scientist]
description = "Jass scientific/reasoning worker. Use for causal interpretation, preregistration/protocol decisions, ambiguous failures, FORCE/runtime conclusions, and broad semantic changes."
config_file = "agents/scientist.toml"
