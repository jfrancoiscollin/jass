name: D4c rank-breaker micro

on:
  pull_request:
    paths:
      - 'docs/experiments/L3_D4C_RANK_BREAKER_MICRO_V1_20260908.*'
      - 'jobs/tools/d4c_*'
      - 'jobs/templates/l3-d4c-rank-breaker-micro-screen-v1.sh'
      - 'jobs/tests/test_d4c_rank_breaker.py'
      - 'src/d4c_runtime_move_order.hpp'
      - '.github/workflows/d4c-rank-breaker-micro.yml'

jobs:
  d4c-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract tests
        run: |
          python -m unittest jobs.tests.test_d4c_rank_breaker -v
          python -m py_compile jobs/tools/d4c_rank_breaker.py jobs/tools/d4c_runtime_render.py jobs/tools/d4c_gate0_render.py
          bash -n jobs/templates/l3-d4c-rank-breaker-micro-screen-v1.sh
      - name: Build isolated 20k teacher
        run: |
          mkdir -p /tmp/d4c-teacher
          git archive HEAD | tar -x -C /tmp/d4c-teacher
          python /tmp/d4c-teacher/jobs/tools/d4b_search_utility_trace_render.py --root /tmp/d4c-teacher
          cmake -S /tmp/d4c-teacher -B /tmp/d4c-teacher/build -DCMAKE_BUILD_TYPE=Release -DJASS_ENDGAME_FEATURES=ON -DJASS_KING_MOBILITY=ON -DJASS_SCAN_PARITY=ON -DJASS_TEMPO_STAGE=ON
          cmake --build /tmp/d4c-teacher/build -j2 --target d4_search_utility_trace_export
      - name: Build isolated D4c Gate0 scorer
        run: |
          mkdir -p /tmp/d4c-gate0
          git archive HEAD | tar -x -C /tmp/d4c-gate0
          python /tmp/d4c-gate0/jobs/tools/d4c_gate0_render.py --root /tmp/d4c-gate0
          cmake -S /tmp/d4c-gate0 -B /tmp/d4c-gate0/build -DCMAKE_BUILD_TYPE=Release -DJASS_ENDGAME_FEATURES=ON -DJASS_KING_MOBILITY=ON -DJASS_SCAN_PARITY=ON -DJASS_TEMPO_STAGE=ON
          cmake --build /tmp/d4c-gate0/build -j2 --target jass_scan_oracle_gate0_runtime
