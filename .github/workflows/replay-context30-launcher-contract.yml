# SPDX-License-Identifier: MIT
name: replay-context30-launcher-contract

on:
  pull_request:
    paths:
      - 'jobs/templates/l3-replay-context30-target-gate-v1.sh'
      - 'jobs/templates/l3-replay-context30-target-gate-v2.sh'
      - 'jobs/templates/l3-replay-context30-target-gate-v3.sh'
      - 'jobs/tests/test_l3_replay_context30_target.py'
      - 'jobs/tests/test_l3_replay_context30_launcher_v3.py'
      - '.github/workflows/replay-context30-launcher-contract.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  render-contract:
    name: Render and audit final context30 script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric test dependencies
        run: python -m pip install numpy scipy
      - name: Run exact launcher and target contracts
        run: |
          python -m unittest \
            jobs.tests.test_l3_replay_context30_target \
            jobs.tests.test_l3_replay_context30_launcher_v3
