name: d3-relational-action-residual

on:
  pull_request:
    paths:
      - 'jobs/tools/d3_relational_action_residual.py'
      - 'jobs/tests/test_d3_relational_action_residual.py'
      - 'jobs/templates/l3-d3-relational-action-preflight-v1.sh'
      - 'jobs/templates/l3-d3-relational-action-fit-v1.sh'
      - '.github/workflows/d3-relational-action-residual.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Compile D3 tooling
        run: python -m py_compile jobs/tools/d3_relational_action_residual.py jobs/tests/test_d3_relational_action_residual.py
      - name: D3 unit tests
        run: python -m unittest jobs.tests.test_d3_relational_action_residual -v
      - name: CLI boundaries
        run: |
          PYTHONPATH=. python jobs/tools/d3_relational_action_residual.py --help >/dev/null
          PYTHONPATH=. python jobs/tools/d3_relational_action_residual.py preflight --help >/dev/null
          PYTHONPATH=. python jobs/tools/d3_relational_action_residual.py fit --help >/dev/null
      - name: Shell syntax
        run: |
          bash -n jobs/templates/l3-d3-relational-action-preflight-v1.sh
          bash -n jobs/templates/l3-d3-relational-action-fit-v1.sh
      - name: Frozen science guards
        run: |
          grep -q '^BASE_WIDTH = 158$' jobs/tools/d3_relational_action_residual.py
          grep -q '^PHASES = 4$' jobs/tools/d3_relational_action_residual.py
          grep -q '^WIDTH = 632$' jobs/tools/d3_relational_action_residual.py
          grep -q '^L2 = 1e-3$' jobs/tools/d3_relational_action_residual.py
          grep -q '^MAX_ITER = 500$' jobs/tools/d3_relational_action_residual.py
          grep -q '^MAXCOR = 10$' jobs/tools/d3_relational_action_residual.py
          grep -q '^GTOL = 1e-6$' jobs/tools/d3_relational_action_residual.py
          grep -q '^BOOTSTRAPS = 200_000$' jobs/tools/d3_relational_action_residual.py
          grep -q '^SEED = 2026111201$' jobs/tools/d3_relational_action_residual.py
          grep -q 'return square if parent_stm == 1 else 51 - square' jobs/tools/d3_relational_action_residual.py
          grep -q 'base_parent + phi @ beta' jobs/tools/d3_relational_action_residual.py
          grep -q 'D3_RELATIONAL_ACTION_TRANSFER_ESTABLISHED_V1' jobs/tools/d3_relational_action_residual.py
      - name: Side-effect and information barriers
        run: |
          ! grep -E -- '--q5|--q50|--q200|--full-ladder|--target-values|--temperature|--runtime-scale' \
            jobs/templates/l3-d3-relational-action-preflight-v1.sh \
            jobs/templates/l3-d3-relational-action-fit-v1.sh
          grep -q '"search_decision_trace": 0' jobs/tools/d3_relational_action_residual.py
          grep -q '"wdl_targets": 0' jobs/tools/d3_relational_action_residual.py
          grep -q 'FULL_FITS__0' jobs/templates/l3-d3-relational-action-preflight-v1.sh
          grep -q 'FULL_FITS__1' jobs/templates/l3-d3-relational-action-fit-v1.sh
          grep -q 'STRENGTH_GAMES__0' jobs/templates/l3-d3-relational-action-fit-v1.sh
