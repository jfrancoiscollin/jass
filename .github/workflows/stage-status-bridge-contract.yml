name: stage-status-bridge-contract

on:
  pull_request:
    paths:
      - 'jobs/tools/run_experiment_stage_status_bridge.py'
      - 'jobs/tests/test_run_experiment_stage_status_bridge.py'
      - '.github/workflows/stage-status-bridge-contract.yml'
  push:
    branches:
      - develop
    paths:
      - 'jobs/tools/run_experiment_stage_status_bridge.py'
      - 'jobs/tests/test_run_experiment_stage_status_bridge.py'
      - '.github/workflows/stage-status-bridge-contract.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bridge
        run: python -m py_compile jobs/tools/run_experiment_stage_status_bridge.py jobs/tests/test_run_experiment_stage_status_bridge.py
      - name: Run bridge contract tests
        run: python -m unittest -v jobs.tests.test_run_experiment_stage_status_bridge
