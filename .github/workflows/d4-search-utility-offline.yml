name: D4 search-utility offline contract

on:
  pull_request:
    paths:
      - 'jobs/tools/d4_search_utility_*.py'
      - 'jobs/tools/d4_search_utility_trace_export.cpp'
      - 'jobs/templates/l3-d4-search-utility-offline-v1.sh'
      - 'jobs/tests/test_d4_search_utility_offline.py'
      - 'docs/experiments/L3_D4_SEARCH_UTILITY_ORDERING_PREREGISTRATION_V1_20260907.*'
      - '.github/workflows/d4-search-utility-offline.yml'
  push:
    branches:
      - 'science/d4-search-utility-offline-impl-v1'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric test dependencies
        run: python -m pip install --quiet numpy scipy
      - name: Compile D4 Python and shell tooling
        run: |
          python -m py_compile \
            jobs/tools/d4_search_utility_pool.py \
            jobs/tools/d4_search_utility_trace_render.py \
            jobs/tools/d4_search_utility_offline.py \
            jobs/tools/d4_search_utility_teacher_aggregate.py \
            jobs/tests/test_d4_search_utility_offline.py
          bash -n jobs/templates/l3-d4-search-utility-offline-v1.sh
      - name: D4 contract unit tests
        run: python -m unittest jobs.tests.test_d4_search_utility_offline -v
      - name: Render isolated teacher source
        run: |
          cp -a . /tmp/d4-render
          python jobs/tools/d4_search_utility_trace_render.py --root /tmp/d4-render
          grep -q 'SearchUtilityTrace\* search_utility_trace' /tmp/d4-render/src/search.hpp
          grep -q 'd4_trace_moves' /tmp/d4-render/src/search.cpp
          grep -q 'd4_search_utility_trace_export' /tmp/d4-render/CMakeLists.txt
      - name: Compile isolated D4 teacher exporter
        run: |
          cmake -S /tmp/d4-render -B /tmp/d4-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DJASS_ENDGAME_FEATURES=ON \
            -DJASS_KING_MOBILITY=ON \
            -DJASS_SCAN_PARITY=ON \
            -DJASS_TEMPO_STAGE=ON
          cmake --build /tmp/d4-build -j2 --target d4_search_utility_trace_export
