name: CLS HIER-L2 2056 fit provenance diagnostic

on:
  pull_request:
    paths:
      - 'jobs/tools/cls_hier_l2_2056_fit_provenance_diagnostic.py'
      - 'jobs/tests/test_cls_hier_l2_2056_fit_provenance_diagnostic_v1.py'
      - 'jobs/launch_profiles/cls-hier-l2-2056-fit-provenance-diagnostic-v1.json'
      - '.github/workflows/cls-hier-l2-2056-fit-provenance-diagnostic.yml'
  push:
    paths:
      - 'jobs/tools/cls_hier_l2_2056_fit_provenance_diagnostic.py'
      - 'jobs/tests/test_cls_hier_l2_2056_fit_provenance_diagnostic_v1.py'
      - 'jobs/launch_profiles/cls-hier-l2-2056-fit-provenance-diagnostic-v1.json'
      - '.github/workflows/cls-hier-l2-2056-fit-provenance-diagnostic.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile jobs/tools/cls_hier_l2_2056_fit_provenance_diagnostic.py
      - run: python -m unittest jobs.tests.test_cls_hier_l2_2056_fit_provenance_diagnostic_v1 -v
