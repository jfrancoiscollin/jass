name: d2-constrained-dense-residual

on:
  pull_request:
    paths:
      - 'jobs/tools/d2_decision_prepare.py'
      - 'jobs/tools/d2_constrained_dense_residual_fit.py'
      - 'jobs/tools/d2_constrained_dense_residual_readout.py'
      - 'jobs/tests/test_d2_constrained_dense_residual.py'
      - 'jobs/templates/l3-d2-constrained-dense-residual-v1.sh'
      - 'jobs/templates/l3-d2-constrained-dense-residual-v1-stage-entrypoint.sh'
      - '.github/workflows/d2-constrained-dense-residual.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependencies
        run: python -m pip install numpy scipy
      - name: Compile D2 tooling
        run: python -m py_compile jobs/tools/d2_decision_prepare.py jobs/tools/d2_constrained_dense_residual_fit.py jobs/tools/d2_constrained_dense_residual_readout.py jobs/tests/test_d2_constrained_dense_residual.py
      - name: D2 unit tests
        run: python -m unittest jobs.tests.test_d2_constrained_dense_residual -v
      - name: Shell syntax
        run: |
          bash -n jobs/templates/l3-d2-constrained-dense-residual-v1.sh
          bash -n jobs/templates/l3-d2-constrained-dense-residual-v1-stage-entrypoint.sh
      - name: Frozen science guards
        run: |
          grep -q 'RESIDUAL_COLS = 240' jobs/tools/d2_constrained_dense_residual_fit.py
          grep -q 'WDL_TOLERANCE = 0.002' jobs/tools/d2_constrained_dense_residual_fit.py
          grep -q 'BISECTION_STEPS = 32' jobs/tools/d2_constrained_dense_residual_fit.py
          grep -q 'SEED = 2026111001' jobs/tools/d2_constrained_dense_residual_readout.py
          grep -q 'hard_competitor_local_action_indices' jobs/tools/d2_decision_prepare.py
          grep -q 'changed_pattern_slots' jobs/tools/d2_constrained_dense_residual_readout.py
          grep -q 'D2_CONSTRAINED_DENSE_RESIDUAL_ESTABLISHED_V1' jobs/tools/d2_constrained_dense_residual_readout.py
          ! grep -E -- '--lambda|--temperature|1843|full-ladder.*fetch' jobs/templates/l3-d2-constrained-dense-residual-v1.sh
