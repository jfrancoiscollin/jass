name: d1-terminal-autopsy

on:
  pull_request:
    paths:
      - 'docs/experiments/L3_D1_TERMINAL_AUTOPSY_V1_20260907.md'
      - 'jobs/tools/d1_terminal_autopsy.py'
      - 'jobs/tests/test_d1_terminal_autopsy.py'
      - 'jobs/templates/l3-d1-terminal-autopsy-v1.sh'
      - '.github/workflows/d1-terminal-autopsy.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependencies
        run: python -m pip install numpy scipy
      - name: Compile autopsy tooling
        run: python -m py_compile jobs/tools/d1_terminal_autopsy.py jobs/tests/test_d1_terminal_autopsy.py
      - name: Run autopsy unit tests
        run: python -m unittest jobs.tests.test_d1_terminal_autopsy -v
      - name: Shell syntax
        run: bash -n jobs/templates/l3-d1-terminal-autopsy-v1.sh
      - name: Frozen science guards
        run: |
          grep -q 'fits = 0' docs/experiments/L3_D1_TERMINAL_AUTOPSY_V1_20260907.md
          grep -q 'model_searches = 0' docs/experiments/L3_D1_TERMINAL_AUTOPSY_V1_20260907.md
          grep -q 'equal_node_gate_authorized = false' docs/experiments/L3_D1_TERMINAL_AUTOPSY_V1_20260907.md
          grep -q 'STOP_DIAGNOSTIC_REVIEW' docs/experiments/L3_D1_TERMINAL_AUTOPSY_V1_20260907.md
          ! grep -E -- '--lambda|lambda_decision=.*[0-9]' jobs/templates/l3-d1-terminal-autopsy-v1.sh
          ! grep -E -- '1843|full-ladder|q200' jobs/templates/l3-d1-terminal-autopsy-v1.sh
