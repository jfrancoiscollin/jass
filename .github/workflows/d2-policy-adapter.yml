name: d2-policy-adapter

on:
  pull_request:
    paths:
      - 'jobs/tools/d2_policy_adapter.py'
      - 'jobs/tests/test_d2_policy_adapter.py'
      - 'jobs/templates/l3-d2-policy-adapter-preflight-v1.sh'
      - 'jobs/templates/l3-d2-policy-adapter-fit-v1.sh'
      - '.github/workflows/d2-policy-adapter.yml'

jobs:
  d2-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric test dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Compile D2 tool
        run: python -m py_compile jobs/tools/d2_policy_adapter.py jobs/tests/test_d2_policy_adapter.py
      - name: Shell syntax
        run: |
          bash -n jobs/templates/l3-d2-policy-adapter-preflight-v1.sh
          bash -n jobs/templates/l3-d2-policy-adapter-fit-v1.sh
      - name: Run D2 unit tests
        run: python -m unittest jobs.tests.test_d2_policy_adapter -v
      - name: Exercise CLI boundaries
        run: |
          PYTHONPATH=. python jobs/tools/d2_policy_adapter.py --help >/dev/null
          PYTHONPATH=. python jobs/tools/d2_policy_adapter.py preflight --help >/dev/null
          PYTHONPATH=. python jobs/tools/d2_policy_adapter.py fit --help >/dev/null
      - name: Prove frozen D2 science constants
        run: |
          grep -q '^EXTRAS = 120$' jobs/tools/d2_policy_adapter.py
          grep -q '^WIDTH = 240$' jobs/tools/d2_policy_adapter.py
          grep -q '^L2 = 1e-3$' jobs/tools/d2_policy_adapter.py
          grep -q '^MAX_ITER = 500$' jobs/tools/d2_policy_adapter.py
          grep -q '^MAXCOR = 10$' jobs/tools/d2_policy_adapter.py
          grep -q '^GTOL = 1e-6$' jobs/tools/d2_policy_adapter.py
          grep -q '^BOOTSTRAPS = 200_000$' jobs/tools/d2_policy_adapter.py
          grep -q '^SEED = 2026111001$' jobs/tools/d2_policy_adapter.py
          grep -q 'method="L-BFGS-B"' jobs/tools/d2_policy_adapter.py
          grep -q 'initial = np.zeros(WIDTH, dtype=np.float64)' jobs/tools/d2_policy_adapter.py
          [ "$(grep -c 'result = minimize(' jobs/tools/d2_policy_adapter.py)" -eq 1 ]
      - name: Prove information and side-effect barriers
        run: |
          ! grep -E '1843|q5k_parent|q50_parent|q200_parent|--target-values|runtime.scale|temperature.sweep' \
            jobs/tools/d2_policy_adapter.py \
            jobs/templates/l3-d2-policy-adapter-preflight-v1.sh \
            jobs/templates/l3-d2-policy-adapter-fit-v1.sh
          grep -q 'valid_metrics_read": 0' jobs/tools/d2_policy_adapter.py
          grep -q 'test_metrics_read": 0' jobs/tools/d2_policy_adapter.py
          grep -q 'equal_node_authorized": False' jobs/tools/d2_policy_adapter.py
          grep -q 'equal_time_authorized": False' jobs/tools/d2_policy_adapter.py
          grep -q 'promotion_authorized": False' jobs/tools/d2_policy_adapter.py
          grep -q 'bake_authorized": False' jobs/tools/d2_policy_adapter.py
          grep -q 'strength_games": 0' jobs/tools/d2_policy_adapter.py
          grep -q 'FULL_FITS__0' jobs/templates/l3-d2-policy-adapter-preflight-v1.sh
          grep -q 'FULL_FITS__1' jobs/templates/l3-d2-policy-adapter-fit-v1.sh
