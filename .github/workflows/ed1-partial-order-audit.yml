name: ED1 partial-order label audit
on:
  pull_request:
    paths:
      - 'jobs/tools/ed1_partial_order_audit.py'
      - 'jobs/tests/test_ed1_partial_order_audit.py'
      - 'jobs/tests/test_ed1_wrapper.py'
      - 'jobs/templates/l3-ed1-partial-order-audit-v1.sh'
      - 'docs/experiments/L3_ED1_PARTIAL_ORDER_LABEL_AUDIT_V1_20260908.md'
      - '.github/workflows/ed1-partial-order-audit.yml'
permissions:
  contents: read
jobs:
  ed1-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Production-shaped contract and entrypoint tests
        run: |
          python -m unittest jobs.tests.test_ed1_partial_order_audit jobs.tests.test_ed1_wrapper -v
          python -m py_compile jobs/tools/ed1_partial_order_audit.py jobs/tests/test_ed1_wrapper.py
          python jobs/tools/ed1_partial_order_audit.py --help
          bash -n jobs/templates/l3-ed1-partial-order-audit-v1.sh
