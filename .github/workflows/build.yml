# SPDX-License-Identifier: MIT
# Build, test and publish Jass on every push.
#
# Four jobs:
#   1. native        — Linux build + unit tests (the contract gate).
#   2. python        — Python tooling tests.
#   3. wasm          — Emscripten build, uploads `jass.js` / `jass.wasm` /
#                      `example.html` as a workflow artifact and stages a
#                      Pages bundle.
#   4. deploy-pages  — Publishes the staged bundle to GitHub Pages on
#                      pushes to `develop`, and only when the repository
#                      variable DEPLOY_DEMO_PAGES == 'true'. It stays off by
#                      default so the pipeline is green without GitHub Pages
#                      configured. To turn the live demo on: set the repo
#                      variable DEPLOY_DEMO_PAGES=true (Settings → Secrets and
#                      variables → Actions → Variables).

name: build

on:
  push:
    paths-ignore:
      - 'jobs/results/**'
      - 'jobs/state/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  native:
    name: Build & test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Syntax-check CLS-G0 native probe
        run: c++ -std=c++20 -fsyntax-only -Isrc -Ipattern_jass/src jobs/tools/cls_g0_runtime_probe.cpp

      - name: Run tests
        run: ./build/jass_tests

  python:
    name: Test Python tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest

      - name: Run Python tests
        run: python -m pytest pattern_jass/tests

      - name: Run ED4 source descriptor inventory tests
        run: python -m unittest jobs.tests.test_ed4_source_descriptor_inventory -v

      - name: Run ED4-FRESH W sizing tests
        run: python -m unittest jobs.tests.test_ed4_fresh_w_sizing -v

      - name: Run ED4-FRESH W source tests
        run: python -m unittest jobs.tests.test_ed4_fresh_w_source -v

      - name: Run ED4-FRESH D/W/S disjointness tests
        run: python -m unittest jobs.tests.test_ed4_fresh_dws_disjointness -v

      - name: Run ED4-FRESH D confirmation tests
        run: python -m unittest jobs.tests.test_ed4_fresh_d_confirmation -v

      - name: Run CLS mirror-scale focused tests
        run: python -m unittest jobs.tests.test_cls_mirror_scale_v1 -v

      - name: Run CLS search-profile focused tests
        run: python -m unittest jobs.tests.test_cls_search_profile_v1 -v

      - name: Run CLS draw/pentanomial/throughput focused tests
        run: python -m unittest jobs.tests.test_cls_draw_pentanomial_throughput_v1 -v

      - name: Run CLS-G0 contract tests
        run: python -m unittest jobs.tests.test_cls_g0_runtime_contract_v1 -v

      - name: Run CLS-G0 runtime gate tests
        run: python -m unittest jobs.tests.test_cls_g0_runtime_gate_v1 -v

      - name: Run CLS-G0 identity preflight tests
        run: python -m unittest jobs.tests.test_cls_g0_runtime_preflight_v1 -v

      - name: Run CLS-G0 valid-arm gate tests
        run: python -m unittest jobs.tests.test_cls_g0_valid_arm_v1 -v

      - name: Run CLS-L objective attribution contract tests
        run: python -m unittest jobs.tests.test_cls_l_objective_attribution_v1 -v

      - name: Run CLS-L source normalization preflight tests
        run: python -m unittest jobs.tests.test_cls_l_source_normalization_preflight_v1 -v

      - name: Run CLS-L three-arm fit contract tests
        run: python -m unittest jobs.tests.test_cls_l_three_arm_fit_v1 -v

      - name: Run CLS-L 2038 valid-arm recovery tests
        run: python -m unittest jobs.tests.test_cls_l_valid_arms_recovery_2038_v1 -v

      - name: Run CLS HIER-L2 next-candidate contract tests
        run: python -m unittest jobs.tests.test_cls_hier_l2_next_candidate_v1 -v

  wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-latest

      - name: Install Emscripten SDK
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install latest
          ~/emsdk/emsdk activate latest

      - name: Build WASM module
        run: |
          source ~/emsdk/emsdk_env.sh
          ./wasm/build.sh

      - name: List build artefacts
        run: ls -la build-wasm

      - name: Upload WASM artefact
        uses: actions/upload-artifact@v4
        with:
          name: jass-wasm
          path: |
            build-wasm/jass.js
            build-wasm/jass.wasm
            build-wasm/example.html
          if-no-files-found: error

      - name: Stage Pages bundle
        run: |
          mkdir -p _site
          cp build-wasm/jass.js          _site/
          cp build-wasm/jass.wasm        _site/
          cp build-wasm/example.html     _site/
          cp build-wasm/example.html     _site/index.html

      - name: Upload Pages bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    name: Deploy demo to GitHub Pages
    needs: wasm
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.DEPLOY_DEMO_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Enable & configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deploy
        uses: actions/deploy-pages@v4
