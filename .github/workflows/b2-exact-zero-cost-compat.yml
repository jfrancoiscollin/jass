name: b2-exact-zero-cost-compat

on:
  pull_request:
    paths:
      - 'jobs/tools/adaptive_sibling_b2_exact_zero_cost_compat.py'
      - 'jobs/tools/adaptive_sibling_b2_recovery_admissibility_preflight_v2.py'
      - 'jobs/tools/adaptive_sibling_b2_statistical_completion_recovery_v2.py'
      - 'jobs/tests/test_adaptive_sibling_b2_exact_zero_cost_compat.py'
      - 'docs/operations/B2_EXACT_ZERO_COST_COMPAT_1827_20260906.md'
      - '.github/workflows/b2-exact-zero-cost-compat.yml'
  push:
    branches: [develop]
    paths:
      - 'jobs/tools/adaptive_sibling_b2_exact_zero_cost_compat.py'
      - 'jobs/tools/adaptive_sibling_b2_recovery_admissibility_preflight_v2.py'
      - 'jobs/tools/adaptive_sibling_b2_statistical_completion_recovery_v2.py'
      - 'jobs/tests/test_adaptive_sibling_b2_exact_zero_cost_compat.py'
      - 'docs/operations/B2_EXACT_ZERO_COST_COMPAT_1827_20260906.md'
      - '.github/workflows/b2-exact-zero-cost-compat.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile compatibility entrypoints
        run: >-
          python -m py_compile
          jobs/tools/adaptive_sibling_b2_exact_zero_cost_compat.py
          jobs/tools/adaptive_sibling_b2_recovery_admissibility_preflight_v2.py
          jobs/tools/adaptive_sibling_b2_statistical_completion_recovery_v2.py
          jobs/tests/test_adaptive_sibling_b2_exact_zero_cost_compat.py
      - name: Run compatibility contract tests
        run: python -m unittest -v jobs.tests.test_adaptive_sibling_b2_exact_zero_cost_compat
