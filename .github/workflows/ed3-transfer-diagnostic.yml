name: ED3 T1 consumed-data transfer diagnostic
on:
  pull_request:
    paths:
      - 'jobs/tools/ed3_transfer_diagnostic*.py'
      - 'jobs/tests/*ed3_transfer_diagnostic*.py'
      - 'jobs/launch_profiles/ed3-transfer-diagnostic-v1.json'
      - '.github/workflows/ed3-transfer-diagnostic.yml'
      - 'docs/experiments/L3_ED3_TRANSFER_DIAGNOSTIC_V1_20260909.md'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: |
          python jobs/tools/launch_regressions_v2.py --profile jobs/launch_profiles/ed3-transfer-diagnostic-v1.json --out /tmp/ed3-t1-regressions.json
          python -m py_compile jobs/tools/ed3_transfer_diagnostic.py jobs/tools/ed3_transfer_diagnostic_inputs.py
