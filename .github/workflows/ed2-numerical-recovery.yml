name: ED2 numerical recovery
on:
  pull_request:
    paths:
      - 'jobs/tools/ed2_value_trust_exact.py'
      - 'jobs/tools/ed2_value_recovery.py'
      - 'jobs/tests/test_ed2_numerical_recovery.py'
      - 'jobs/templates/l3-ed2-numerical-recovery-n1.sh'
      - 'docs/experiments/L3_ED2_NUMERICAL_RECOVERY_N1_20260908.md'
      - '.github/workflows/ed2-numerical-recovery.yml'
permissions:
  contents: read
jobs:
  numerical-and-native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Build unchanged native evaluator probe
        run: |
          python pattern_jass/tools/gen_patterns.py --emit --variant 8cf
          printf '\nadd_executable(jass_ed2_value_probe jobs/tools/ed2_value_probe.cpp)\ntarget_link_libraries(jass_ed2_value_probe PRIVATE jass_lib)\n' >> CMakeLists.txt
          cmake -S . -B /tmp/ed2-n1-build -DCMAKE_BUILD_TYPE=Release -DJASS_ENDGAME_FEATURES=ON -DJASS_KING_MOBILITY=ON -DJASS_SCAN_PARITY=ON -DJASS_TEMPO_STAGE=ON
          cmake --build /tmp/ed2-n1-build -j2 --target jass_ed2_value_probe
      - name: Unchanged native contracts and new numerical/reuse tests
        env:
          ED2_VALUE_PROBE: /tmp/ed2-n1-build/jass_ed2_value_probe
        run: |
          python -m unittest jobs.tests.test_ed2_value_learning jobs.tests.test_ed2_numerical_recovery -v
          python -m py_compile jobs/tools/ed2_value_trust_exact.py jobs/tools/ed2_value_recovery.py
          bash -n jobs/templates/l3-ed2-numerical-recovery-n1.sh
          test "$(git hash-object jobs/templates/l3-ed2-paired-value-fit-v1.sh)" = 7c4b077e53fbc8c035b96e47116bc055973d2431
          sed 's@jobs/tools/ed2_value_entrypoint.py@jobs/tools/ed2_value_recovery.py@' jobs/templates/l3-ed2-paired-value-fit-v1.sh >/tmp/ed2-n1-rendered.sh
          bash -n /tmp/ed2-n1-rendered.sh
