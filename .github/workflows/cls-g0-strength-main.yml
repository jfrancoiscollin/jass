name: cls-g0-strength-main
on:
  pull_request:
    paths:
      - 'jobs/tools/cls_g0_strength_main.py'
      - 'jobs/tests/test_cls_g0_strength_main.py'
      - 'jobs/launch_profiles/cls-g0-strength-main-v1.json'
      - 'docs/experiments/CLS_G0_STRENGTH_VALIDATION_MAIN_V1_20260920.md'
      - '.github/workflows/cls-g0-strength-main.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest jobs.tests.test_cls_g0_strength_main jobs.tests.test_cls_g0_strength_calibration -v
