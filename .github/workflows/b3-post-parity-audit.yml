name: b3-post-parity-audit
on:
  pull_request:
    paths:
      - 'jobs/tools/adaptive_sibling_b3_post_parity_audit.py'
      - 'jobs/tests/test_adaptive_sibling_b3_post_parity_audit.py'
      - '.github/workflows/b3-post-parity-audit.yml'

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile audit entrypoint
        run: python -m py_compile jobs/tools/adaptive_sibling_b3_post_parity_audit.py
      - name: Exercise real direct CLI
        run: python jobs/tools/adaptive_sibling_b3_post_parity_audit.py --help >/dev/null
      - name: Run contract tests
        run: python -m unittest -v jobs.tests.test_adaptive_sibling_b3_post_parity_audit
