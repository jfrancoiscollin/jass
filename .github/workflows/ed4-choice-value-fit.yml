name: ED4 real candidate complete fit contract
on:
  pull_request:
    paths:
      - 'jobs/tools/ed4_choice*.py'
      - 'jobs/tests/test_ed4_choice*.py'
      - 'jobs/tests/ed4_choice_native_contract.py'
      - 'jobs/launch_profiles/ed4-choice-value-fit-v1.json'
      - 'docs/experiments/L3_ED4_CHOICE_SET_REAL_CANDIDATE_FIT_V1_20260909.md'
      - '.github/workflows/ed4-choice-value-fit.yml'
permissions:
  contents: read
jobs:
  complete-fit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install numpy==2.5.2 scipy==1.18.0
      - name: Exact launch regression profile with synthetic transport
        run: python jobs/tools/launch_regressions_v2.py --profile jobs/launch_profiles/ed4-choice-value-fit-v1.json --out /tmp/ed4-regressions.json
      - name: Build unchanged production evaluator
        run: |
          python pattern_jass/tools/gen_patterns.py --emit --variant 8cf
          printf '\nadd_executable(jass_ed4_probe jobs/tools/ed2_value_probe.cpp)\ntarget_link_libraries(jass_ed4_probe PRIVATE jass_lib)\n' >> CMakeLists.txt
          cmake -S . -B /tmp/ed4-native -DCMAKE_BUILD_TYPE=Release -DJASS_ENDGAME_FEATURES=ON -DJASS_KING_MOBILITY=ON -DJASS_SCAN_PARITY=ON -DJASS_TEMPO_STAGE=ON
          cmake --build /tmp/ed4-native -j2 --target jass_ed4_probe
      - name: Actual native fit, repeated candidate and original publisher readback
        env:
          ED4_NATIVE_PROBE: /tmp/ed4-native/jass_ed4_probe
        run: |
          python -m jobs.tests.ed4_choice_native_contract
          python -m unittest jobs.tests.test_ed4_choice_publication -v
      - name: Fixed P0 numerical fixture through the same math implementation
        run: python -m jobs.tools.ed4_choice_preflight --native-probe /tmp/ed4-native/jass_ed4_probe --out-dir /tmp/ed4-p0-recheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ed4-fit-contract-receipts
          if-no-files-found: warn
          path: |
            /tmp/ed4-regressions.json
            /tmp/ed4-p0-recheck/report.json
            /tmp/ed4-p0-recheck/manifest.json
            /tmp/ed4-p0-recheck/failure.json
