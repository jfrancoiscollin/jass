name: d2-constrained-dense-residual-prereg

on:
  pull_request:
    paths:
      - 'docs/experiments/L3_D2_CONSTRAINED_DENSE_RESIDUAL_V1_20260907.md'
      - '.github/workflows/d2-constrained-dense-residual-prereg.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frozen D2 contract
        run: |
          DOC=docs/experiments/L3_D2_CONSTRAINED_DENSE_RESIDUAL_V1_20260907.md
          grep -q '240 scalar parameters total' "$DOC"
          grep -q 'hard competitors = all non-selected actions with survived5=true' "$DOC"
          grep -q 'DeltaWDL_train <= 0.002000' "$DOC"
          grep -q 'exactly 32 iterations' "$DOC"
          grep -q 'seed         = 2026111001' "$DOC"
          grep -q 'D2_CONSTRAINED_DENSE_RESIDUAL_ESTABLISHED_V1' "$DOC"
          grep -q 'D2_CONSTRAINED_DENSE_RESIDUAL_NOT_ESTABLISHED_V1' "$DOC"
          grep -q 'D2_CONSTRAINED_DENSE_RESIDUAL_INVALID_V1' "$DOC"
          grep -q 'no lambda/L2/alpha/competitor-definition retuning' "$DOC"
          ! grep -E 'q200.*(target|softmax)|temperature sweep|strength games.*[1-9]' "$DOC"
