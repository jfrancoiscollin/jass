name: d1-wdl-listwise

on:
  pull_request:
    paths:
      - 'jobs/tools/d1_decision_prepare.py'
      - 'jobs/tools/d1_listwise_fit.py'
      - 'jobs/tools/d1_postfit_readout.py'
      - 'jobs/tests/test_d1_listwise.py'
      - 'jobs/templates/l3-d1-wdl-listwise-fit-v1.sh'
      - '.github/workflows/d1-wdl-listwise.yml'

jobs:
  d1-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric test dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Compile D1 tools
        run: |
          python -m py_compile \
            jobs/tools/d1_decision_prepare.py \
            jobs/tools/d1_listwise_fit.py \
            jobs/tools/d1_postfit_readout.py
      - name: Run D1 unit tests
        run: python -m unittest jobs.tests.test_d1_listwise -v
      - name: Exercise CLI boundaries
        run: |
          PYTHONPATH=. python jobs/tools/d1_decision_prepare.py --help >/dev/null
          PYTHONPATH=. python jobs/tools/d1_listwise_fit.py --help >/dev/null
          PYTHONPATH=. python jobs/tools/d1_postfit_readout.py --help >/dev/null
      - name: Prove frozen science guards
        run: |
          grep -q 'LAMBDA = {ARM_CONTROL: 0.0, ARM_LISTWISE: 1.0}' jobs/tools/d1_listwise_fit.py
          grep -q 'BOOTSTRAPS = 200_000' jobs/tools/d1_postfit_readout.py
          grep -q 'SEED = 2026110901' jobs/tools/d1_postfit_readout.py
          grep -q 'WDL_TOLERANCE = 0.002' jobs/tools/d1_postfit_readout.py
          ! grep -E 'q5k_parent|q50_parent|q200_parent|1843-l3-decision' jobs/tools/d1_listwise_fit.py jobs/tools/d1_postfit_readout.py
