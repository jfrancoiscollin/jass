name: CLS bottleneck classification

on:
  pull_request:
    paths:
      - 'jobs/tools/cls_bottleneck_classification_stage.py'
      - 'jobs/tools/cls_bottleneck_classification_launch_stage.py'
      - 'jobs/launch_profiles/cls-bottleneck-classification-v1.json'
      - 'jobs/tests/test_cls_bottleneck_classification_v1.py'
      - 'docs/experiments/L3_CLS_BOTTLENECK_CLASSIFICATION_V1_20260916.md'
      - '.github/workflows/cls-bottleneck-classification.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m unittest jobs.tests.test_cls_bottleneck_classification_v1 -v
